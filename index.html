<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Progress Component</title>
        <link rel="stylesheet" href="./css/style.css">
        <link rel="stylesheet" href="./css/progress-component.css">
    </head>
    <body>
        <div class="app">
            <h1 class="app-text">Progress</h1>

            <div class="app-content">
                <div class="app-progress-wrapper">
                    <div id="progress"></div>
                </div>
            
                <div class="controls">
                    <input
                        class="control__input"
                        id="value-input"
                        type="text"
                        inputmode="numeric"
                        autocomplete="off"
                    />
                    <label class="app-text" for="value-input">Value</label>

                    <label class="switch">
                        <input id="animate-input" type="checkbox" />
                        <span class="switch__slider"></span>
                    </label>
                    <label class="app-text" for="animate-input">Animate</label>

                    <label class="switch">
                        <input id="hide-input" type="checkbox" />
                        <span class="switch__slider"></span>
                    </label>
                    <label class="app-text" for="hide-input">Hide</label>
                </div>
            </div>
        </div>

        <script src="./js/progress.js"></script>
        <script src="./js/app.js"></script>
    </body>
</html>

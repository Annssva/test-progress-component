<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Progress Component</title>
        <link rel="stylesheet" href="./css/style.css">
        <link rel="stylesheet" href="./css/progress.css">
    </head>
    <body>
        <div class="app">
            <h1 class="app-text">Progress</h1>

            <div class="app-content">
                <div class="progress-wrapper">
                <div id="progress" class="progress"></div>
                </div>
            
                <div class="controls">
                    <input
                        class="control__input"
                        id="value-input"
                        type="number"
                        min="0"
                        max="100"
                    />
                    <label class="app-text" for="value-input">Value</label>

                    <label class="switch">
                        <input id="animate-input" type="checkbox" />
                        <span class="switch__slider"></span>
                    </label>
                    <span class="app-text">Animate</span>

                    <label class="switch">
                        <input id="hide-input" type="checkbox" />
                        <span class="switch__slider"></span>
                    </label>
                    <span class="app-text">Hide</span>
                </div>
            </div>
        </div>

        <script src="./js/progress.js"></script>
        <script src="./js/app.js"></script>
    </body>
</html>
